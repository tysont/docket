# A Markdown task list whose lines carry bracketed inline fields ([key:: value]).
# An answer's window (--when) is written as [when:: ...] so the next run keeps its block there.
# The workspace sets the file path. Tiers are headings; quality rules are a
# denylist plus a safe default, never an allowlist.
destinations:
  backlog:
    adapter: markdown_tasks
    visibility: private
    section: "## Inbox"
    sections:
      inbox: "## Inbox"
      someday: "## Someday"
    grammar:
      open: "- [ ] "
      done: ["- [x] ", "- [X] "]
      fields: bracket
    carry_field: carry
    line_template: "- [ ] {title} [source:: {source}]{?due} [due:: {due}]{/due}{?est} [est:: {est|duration}]{/est}{?when} [when:: {when}]{/when}"
    quality:
      imperative: { deny: [fyi, note, maybe, consider], default_verb: "Follow up on" }
      max_length: 200

# Metadata (never merged): scope, and the placeholders docket init writes.
preset: { scope: workspace }
