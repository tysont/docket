# Chat spaces and messages through an MCP gateway's code-execution tool. The workspace names the transport and the gateway's tools in params.
source:
  capabilities: [read, discover]
  volatile: true
  cursor: { model: units, position: order_key, lookback: 1d }
  # The workspace names the gateway's two tools and, where they differ from the defaults,
  # the argument names those tools take.
  params:
    spaces_tool: null
    messages_tool: null
    space_arg: parent
    size_arg: pageSize
    after_arg: after
    token_arg: pageToken
  request:
    # A gateway hands a tool result back as a parsed object, as JSON text, or as MCP content
    # (text blocks, bare or under "content"). read() takes any of them.
    discover:
      script: |
        async () => {
          const read = (r) => {
            if (r && !Array.isArray(r) && Array.isArray(r.content)) r = r.content;
            if (Array.isArray(r)) r = r.map(b => (b && typeof b.text === "string") ? b.text : "").join("");
            return (typeof r === "string" ? JSON.parse(r) : r) ?? {};
          };
          const v = read(await codemode[{{tool}}]({ [{{token_arg}}]: {{token}} }));
          const spaces = (v.spaces ?? []).map(s => ({
            name: s.name ?? null, displayName: s.displayName ?? null,
            spaceType: s.spaceType ?? null,
            memberCount: s.memberCount ?? s.membershipCount?.joinedDirectHumanUserCount ?? null }));
          return JSON.stringify({ spaces, nextPageToken: v.nextPageToken ?? null });
        }
      args: { tool: "{params.spaces_tool}", token: "{page.token}", token_arg: "{params.token_arg}" }
    read:
      script: |
        async () => {
          const read = (r) => {
            if (r && !Array.isArray(r) && Array.isArray(r.content)) r = r.content;
            if (Array.isArray(r)) r = r.map(b => (b && typeof b.text === "string") ? b.text : "").join("");
            return (typeof r === "string" ? JSON.parse(r) : r) ?? {};
          };
          const v = read(await codemode[{{tool}}]({
            [{{space_arg}}]: {{space}}, [{{after_arg}}]: {{after}},
            [{{size_arg}}]: {{page_size}}, [{{token_arg}}]: {{token}} }));
          const messages = (v.messages ?? []).map(m => ({
            name: m.name ?? null, createTime: m.createTime ?? null, text: String(m.text ?? "").slice(0, 2000),
            sender: { name: m.sender?.name ?? null, displayName: m.sender?.displayName ?? null },
            thread: { name: m.thread?.name ?? null } }));
          return JSON.stringify({ messages, nextPageToken: v.nextPageToken ?? null, truncated: v.truncated ?? false });
        }
      args:
        tool: "{params.messages_tool}"
        space: "{unit.id}"
        after: "{cursor.start}"
        page_size: "{page.size}"
        token: "{page.token}"
        space_arg: "{params.space_arg}"
        size_arg: "{params.size_arg}"
        after_arg: "{params.after_arg}"
        token_arg: "{params.token_arg}"
  discover:
    kind: space
    entries: "$.spaces"
    next: "$.nextPageToken"
    id: "$.name"
    name: "$.displayName"
    type: "$.spaceType"
    members: "$.memberCount"
  paging:
    kind: message
    page_size: 100
    min_page_size: 10
    entries: "$.messages"
    next: "$.nextPageToken"
    end_when: [token_absent]
    truncated: "$.truncated"
    too_large: ["too large", "truncat"]
    order_key: "$.createTime"
  contract:
    space:
      required: { name: str }
      optional: { displayName: str, spaceType: str, memberCount: int }
      enums: { spaceType: [SPACE, GROUP_CHAT, DIRECT_MESSAGE, ROOM, DM, GROUP_DM] }
      variations:
        spaceType: { unknown: { reading: "treat as a group space", value: ROOM, extend: "preset mcp/chat-codemode: contract.space.enums.spaceType" } }
    message:
      required: { name: str, createTime: timestamp }
      optional: { text: str, sender.displayName: str, sender.name: str, thread.name: str }
      variations:
        sender.displayName: { missing: { reading: "use sender.name", use: sender.name, record: false } }
  mapping: { id: "$.name", text: "$.text", title: "$.text", from: "$.sender.displayName", at: "$.createTime",
             from.handle: "$.sender.name", thread: "$.thread.name" }

# Metadata (never merged): scope, and the placeholders docket init writes.
preset:
  scope: source
  scaffold:
    sources:
      chat: { transport: gateway, params: { spaces_tool: list_spaces, messages_tool: list_messages } }
    transports:
      gateway: { kind: codemode, command: [path/to/mcp-gateway], tool: execute_code }
