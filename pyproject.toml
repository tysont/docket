[project]
name = "docket"
version = "0.1.0"
description = "An agent-driven daily triage and planning engine configured entirely by workspace files."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "ruamel.yaml",
    "httpx",
    "tzdata",
]

[project.scripts]
docket = "docket.cli:entry"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: excluded from make test-fast",
    "smoke: the smoke tier (make test-smoke)",
]
