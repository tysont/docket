# Support-lead persona: queue-based work from a ticket feed, a plain-text worklog.
# Everything lives in this one file. All names, handles and data are invented.
version: 1
presets: [policy/basic-defaults]

workflows:
  shift:
    stages: [collect, assess, merge, decide, plan, approve, apply, close]
    sources: [tickets, pager]
    questions: { kinds: [finding], budget: 12 }
    options: queue
  isolation:
    stages: [collect, assess, merge, decide, plan, approve, apply, close]
    sources: [tickets, pager, metrics, kb, history]
    questions: { kinds: [finding], budget: 4 }
    options: queue

profile:
  timezone: Europe/Lisbon
  workdays: [mon, tue, wed, thu, fri, sat]
  internal_domains: [helpdesk-co.example]
  me:
    name: Morgan Ellis
    aliases: [Morgan, ME]
    handles: { tickets: mellis, mail: morgan@helpdesk-co.example }
    reports_to: taylor
  people:
    - id: taylor
      name: Taylor Brooks
      handles: { tickets: tbrooks, mail: taylor@helpdesk-co.example }
      roles: [support-director]
    - id: riley
      name: Riley Chen
      handles: { tickets: rchen }
      reports_to: me
      roles: [agent]
    - id: avery
      name: Avery Quinn
      handles: { tickets: aquinn }
      reports_to: me
      roles: [agent]
  groups:
    - id: billing-queue
      name: Billing queue
      members: [riley]
    - id: tier1-queue
      name: Tier 1 queue
      members: [avery, riley]
      forum: queue-standup
  topics:
    - id: refunds
      aliases: [refund backlog, chargebacks]
      area: Billing
      owned: true
  entities:
    - id: globex
      aliases: [Globex]
      protected: true
  forums:
    - id: queue-standup
      name: Queue Standup
      calendar_match: { title_regex: "^Queue Standup" }
  calendar:
    classify:
      - { match: { title_regex: "^Shift Handover" }, kind: meeting }
      - { match: { title_regex: "^Vacation" }, kind: out_of_office }
      - { match: { property: { attendees: true } }, kind: meeting }

sources:
  tickets:
    kind: files
    path: data/tickets.jsonl
    volatile: true
    mapping:
      id: "$.key"
      title: "$.summary"
      text: "$.description"
      from: "$.requester.email"
      at: "$.created"
      fields.queue: "$.queue"
      fields.priority: "$.priority"
  pager:
    extends: exec/jsonl-source
    description: The paging feed, through a small exec bridge (recorded).
    transport: pager-bridge
    volatile: true
    contract:
      entry:
        optional: { severity: str, service: str }
        enums: { severity: [sev1, sev2, sev3] }
    mapping: { title: "$.title", text: "$.text", at: "$.at", fields.queue: "$.service", fields.priority: "$.severity" }
  metrics:
    extends: http/json-api
    description: Queue metrics API, failing in the recording.
    transport: metrics-api
    params: { path: /api/queue-stats }
  kb:
    extends: exec/jsonl-source
    description: Knowledge base changes behind a token that has expired.
    transport: kb-bridge
    auth:
      check: [docket-stub-auth, --fail]
      instructions: "Renew the knowledge base token (stub-login kb), then rerun the collect command."
  history:
    extends: exec/jsonl-source
    description: Closed-ticket history; the page budget is deliberately small.
    transport: history-bridge
    budget: { max_pages: 1, page_size: 4 }

transports:
  pager-bridge: { kind: replay, path: recordings/pager-bridge.jsonl }
  metrics-api: { kind: replay, path: recordings/metrics-api.jsonl }
  kb-bridge: { kind: replay, path: recordings/kb-bridge.jsonl }
  history-bridge: { kind: replay, path: recordings/history-bridge.jsonl }

decisions:
  option_sets:
    queue:
      finding:
        - { id: take, action: task.add, label: "Take it: {title|truncate:50}" }
        - { id: escalate, action: task.add, label: "Escalate to the {fields.queue} lead", destination: worklog }
        - { id: watch, action: watch, label: "Watch" }
        - { id: close, action: dismiss, label: "Close without action" }

destinations:
  worklog:
    adapter: markdown_tasks
    path: worklog/todo.md
    section: "## Today"
    line_template: "TODO {title|truncate:70} | queue={fields.queue} | prio={fields.priority}{?due} | due={due}{/due}"
    grammar: { open: "TODO ", done: ["DONE "], fields: delimited, separator: " | ", assign: "=" }
    carry_field: carried
    quality:
      imperative: { deny: [fyi, maybe], default_verb: "Look into" }
      max_length: 90

journal:
  title: "Shift log {run.date}"
  sections:
    - heading: Queues read
      template: "{#sources}- {id}: {outcome}, {records} record(s)\n{/sources}"
    - heading: Taken
      template: "{#operations}- {line} [{outcome}]\n{/operations}"
    - heading: Decisions
      template: "{#dispositions}- {topic}: {decision}{?destination} to {destination}{/destination}\n{/dispositions}"
    - heading: Not asked
      template: "{#not_asked}- {title}\n{/not_asked}"
      skip_empty: true
    - heading: Unexpected shapes
      template: "{#unexpected}- {area} / {detail}: {reading}\n{/unexpected}"
      skip_empty: true

signals:
  scoring: { floor: 40 }
  # Queue work: tickets and pages are assessed by their fields; only low-priority tickets
  # and pages of an unknown severity go to an agent. Every name is invented.
  references:
    ticket: { pattern: "\\bSUP-\\d{3,6}\\b" }
    page: { pattern: "\\bPG-\\d{3,6}\\b" }
  rules:
    - id: p1-ticket
      when: { all: [ { source: tickets }, { field: { name: priority, equals: P1 } } ] }
      then: { assess: rules_only, importance: +35, urgency: +35, surface: always, reason: "P1 ticket" }
    - id: p2-ticket
      when: { all: [ { source: tickets }, { field: { name: priority, equals: P2 } } ] }
      then: { assess: rules_only, importance: +15, urgency: +15 }
    - id: strategic-requester
      when: { all: [ { source: tickets }, { from: { domain: [globex.example] } } ] }
      then: { importance: +15, sensitivity: customer, tags: [strategic] }
    - id: protected-mention
      when: { mentions: { entities: { protected: true } } }
      then: { sensitivity: customer }
    - id: billing-queue
      when: { field: { name: queue, equals: billing } }
      then: { route: worklog, area: Billing, importance: +10 }
    - id: account-closure
      when: { text: { phrases: ["close account"] } }
      then: { dismiss: "Account closures belong to the retention queue" }
    - id: sev1-page
      when: { all: [ { source: pager }, { field: { name: priority, equals: sev1 } } ] }
      then: { assess: rules_only, urgency: +40, surface: always, reason: "Sev1 page" }
    - id: sev2-page
      when: { all: [ { source: pager }, { field: { name: priority, equals: sev2 } } ] }
      then: { assess: rules_only, urgency: +20 }
    - id: sev3-page
      when: { all: [ { source: pager }, { field: { name: priority, equals: sev3 } } ] }
      then: { dismiss: "Low-severity page" }
    - id: waiting-ticket
      when: { all: [ { source: tickets }, { age: { older_than: 2d } } ] }
      then: { urgency: +10, reason: "Waiting more than two days" }

tasks:
  assess: { max_items: 8 }
  kinds:
    sla_check:
      description: The risk that an open ticket breaches its service level.
      select: { sources: [tickets] }
      max_items: 12
      instructions: >-
        For each ticket in the queues {me.name} leads, judge the risk that it breaches its
        service level before the next shift.
      fields:
        breach_risk:
          type: enum
          description: How likely a breach is before the next shift.
          required: true
          values: { low: Well inside its service level., medium: Close to its limit., high: Will breach without action. }
          safe: medium
        time_left: { type: duration, description: "Time left before the breach, when the ticket shows it." }
        impact: { type: int, description: "Customer impact from 0 (none) to 100 (severe)." }
        related: { type: item_ref, description: Another ticket in this pack about the same problem. }
        note: { type: str, description: One line for the queue lead., max_length: 120 }
      rules:
        - { when: { breach_risk: high }, require: [note, time_left] }
