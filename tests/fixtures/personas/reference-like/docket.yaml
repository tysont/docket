# Reference-like persona: a people manager with chat, mail and a Markdown backlog.
# All names, handles and data are invented.
version: 1
includes: [profile.yaml, sources.yaml, signals.yaml, destinations.yaml, planning.yaml]
presets: [markdown/tasks-inline-fields, policy/basic-defaults, options/basic]

workflows:
  daily:
    description: Evening collection, morning decisions.
    stages: [collect, assess, merge, review, decide, plan, approve, apply, close]
    sources: [chat, mail, transcripts]
    pause_before: decide
    refresh_on_resume: [chat, mail]
    review: { pool: 40 }
    questions: { kinds: [finding], bursts: 1, budget: 15 }
    options: basic
  triage:
    stages: [collect, assess, merge, decide, plan, approve, apply, close]
    sources: [chat, mail]
    questions: { kinds: [finding], budget: 8 }
    options: basic
  isolation:
    description: Every source, including one failing, one unavailable and one over budget.
    stages: [collect, assess, merge, decide, plan, approve, apply, close]
    sources: [chat, mail, transcripts, status, wiki, archive]
    questions: { kinds: [finding], budget: 5 }
    options: basic
  signals-digest:
    description: A read-only digest over chat, mail and escalation tickets; no decisions.
    stages: [collect, assess, merge, close]
    sources: [chat, mail, escalations]
  week-plan:
    description: Plan the next days onto the calendar and show the plan; nothing is applied.
    stages: [collect, assess, merge, decide, plan, close]
    sources: [chat, mail]
    questions: { kinds: [finding], budget: 3 }
    options: basic

decisions:
  templates:
    finding_prompt: "[{source}] {title|truncate:90}{?from} (from {from}){/from}"

tasks:
  assess: { max_items: 10 }
  review: { max_items: 12 }
  kinds:
    tone:
      description: The tone of chat messages, for planning replies.
      select: { sources: [chat] }
      instructions: >-
        For each chat message sent to {me.name}, judge the writer's tone and whether the
        writer is waiting for an answer from {me.name}.
      fields:
        tone:
          type: enum
          description: The writer's tone.
          required: true
          values: { calm: Neutral or friendly., concerned: Worried about an outcome., urgent: Wants action now. }
          safe: calm
          deny: [mixed]
        needs_reply: { type: bool, description: "true when the writer is waiting for an answer.", required: true }
        reply_by: { type: date, description: "When the answer is due, only when the message says." }
        quote: { type: evidence, description: The words that show the tone. }
      rules:
        - { when: { needs_reply: true }, require: [quote], reason: an answer needs the words it answers }
