# Reference-like persona: a people manager with chat, mail and a Markdown backlog.
# All names, handles and data are invented.
version: 1
includes: [profile.yaml, sources.yaml, signals.yaml, destinations.yaml, planning.yaml, journal.yaml]
presets: [markdown/tasks-inline-fields, policy/basic-defaults, options/basic, options/standard]

graphs:
  daily:
    # Read in the evening, decide in the morning.
    read-chat: { read: chat }
    read-mail: { read: mail }
    read-transcripts: { read: transcripts }
    assess: { judge: assess, from: [read-chat, read-mail, read-transcripts] }
    tone: { judge: tone, from: [read-chat] }
    merge: { merge: [assess, tone] }
    review: { judge: review, from: [merge] }
    decide: { ask: basic, from: [review], questions: { kinds: [finding], bursts: 1, budget: 15, overflow: drop } }
    plan: { plan: [decide] }
    approve: { approve: plan }
    apply: { apply: approve }
  triage:
    read-chat: { read: chat }
    read-mail: { read: mail }
    assess: { judge: assess, from: [read-chat, read-mail] }
    tone: { judge: tone, from: [read-chat] }
    merge: { merge: [assess, tone] }
    decide: { ask: basic, from: [merge], questions: { kinds: [finding], budget: 8, overflow: drop } }
    plan: { plan: [decide] }
    approve: { approve: plan }
    apply: { apply: approve }
  isolation:
    # Every source, including one failing, one unavailable and one over budget.
    read-chat: { read: chat }
    read-mail: { read: mail }
    read-transcripts: { read: transcripts }
    read-status: { read: status }
    read-wiki: { read: wiki }
    read-archive: { read: archive }
    assess: { judge: assess, from: [read-chat, read-mail, read-transcripts, read-status, read-wiki, read-archive] }
    tone: { judge: tone, from: [read-chat] }
    merge: { merge: [assess, tone] }
    decide: { ask: basic, from: [merge], questions: { kinds: [finding], budget: 5, overflow: drop } }
    plan: { plan: [decide] }
    approve: { approve: plan }
    apply: { apply: approve }
  signals-digest:
    # A read-only digest over chat, mail and escalation tickets; no decisions.
    read-chat: { read: chat }
    read-mail: { read: mail }
    read-escalations: { read: escalations }
    assess: { judge: assess, from: [read-chat, read-mail, read-escalations] }
    tone: { judge: tone, from: [read-chat] }
    merge: { merge: [assess, tone] }
  week-plan:
    # Plan the next days onto the calendar and show the plan; nothing is applied.
    read-chat: { read: chat }
    read-mail: { read: mail }
    assess: { judge: assess, from: [read-chat, read-mail] }
    tone: { judge: tone, from: [read-chat] }
    merge: { merge: [assess, tone] }
    decide: { ask: standard, from: [merge], questions: { kinds: [reconcile, finding, verify], budget: 3, overflow: drop } }
    plan: { plan: [decide], schedule_tasks: true }

decisions:
  templates:
    finding_prompt: "[{source}] {title|truncate:90}{?from} (from {from}){/from}"

tasks:
  assess: { max_items: 10 }
  review: { max_items: 12 }
  kinds:
    tone:
      description: The tone of chat messages, for planning replies.
      instructions: >-
        For each chat message sent to {me.name}, judge the writer's tone and whether the
        writer is waiting for an answer from {me.name}.
      fields:
        tone:
          type: enum
          description: The writer's tone.
          required: true
          values: { calm: Neutral or friendly., concerned: Worried about an outcome., urgent: Wants action now. }
          safe: calm
          deny: [mixed]
        needs_reply: { type: bool, description: "true when the writer is waiting for an answer.", required: true }
        reply_by: { type: date, description: "When the answer is due, only when the message says." }
        quote: { type: evidence, description: The words that show the tone. }
      rules:
        - { when: { needs_reply: true }, require: [quote], reason: an answer needs the words it answers }
