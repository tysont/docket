# Requirement traceability (Test Plan §9).
#
# Every requirement id in docs/Docket Product Requirements.md maps to the tests that prove it,
# as test node ids (file::function; a parametrized test is named once). A requirement deferred
# by the Implementation Plan §5 carries `deferred: <reason>` and maps the tests of the part that
# is in v1. tests/contract/test_traceability.py fails when a Must, or a non-deferred Should, has
# no mapped test, when a mapped test does not exist, or when an id here is not in the PRD.

